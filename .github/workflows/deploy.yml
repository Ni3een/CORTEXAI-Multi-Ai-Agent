name: CortexAI Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch: # Manual trigger option

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
  ECR_REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      # Configure AWS
      - name: 🔐 Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Verify AWS credentials
      - name: ✅ Verify AWS Connection
        run: |
          echo "Verifying AWS credentials..."
          aws sts get-caller-identity
          echo "AWS connection verified successfully!"

      # Login to ECR using official action
      - name: 🔑 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        with:
          mask-password: 'true'

      - name: ✅ Verify ECR Login
        run: |
          echo "ECR Registry: ${{ steps.login-ecr.outputs.registry }}"
          echo "Login successful!"

      # Check/Create ECR Repositories
      - name: 📦 Verify ECR Repositories
        run: |
          echo "Checking ECR repositories..."
          
          REPOS=("gateway" "auth-service" "chat-service" "agent-service" "billing-service")
          
          for repo in "${REPOS[@]}"; do
            echo "Checking repository: $repo"
            if ! aws ecr describe-repositories --repository-names "$repo" --region "$AWS_REGION" 2>/dev/null; then
              echo "Creating repository: $repo"
              aws ecr create-repository \
                --repository-name "$repo" \
                --region "$AWS_REGION" \
                --image-scanning-configuration scanOnPush=true \
                --encryption-configuration encryptionType=AES256 || echo "Repository might already exist"
            else
              echo "✅ Repository $repo exists"
            fi
          done
          
          echo "All repositories verified!"

      # =========================
      # Gateway Service
      # =========================

      - name: 🏗️ Build Gateway Image
        run: |
          echo "Building Gateway service..."
          docker build \
            -f backend/gateway/Dockerfile \
            -t gateway \
            backend
          echo "Gateway build complete!"

      - name: 🏷️ Tag Gateway Image
        run: |
          docker tag gateway:latest "$ECR_REGISTRY/gateway:latest"
          docker tag gateway:latest "$ECR_REGISTRY/gateway:${{ github.sha }}"

      - name: 📤 Push Gateway to ECR
        run: |
          echo "Pushing Gateway to ECR..."
          docker push "$ECR_REGISTRY/gateway:latest"
          docker push "$ECR_REGISTRY/gateway:${{ github.sha }}"
          echo "Gateway pushed successfully!"

      # =========================
      # Auth Service
      # =========================

      - name: 🏗️ Build Auth Service Image
        run: |
          echo "Building Auth service..."
          docker build \
            -f backend/services/auth/Dockerfile \
            -t auth-service \
            backend
          echo "Auth build complete!"

      - name: 🏷️ Tag Auth Image
        run: |
          docker tag auth-service:latest "$ECR_REGISTRY/auth-service:latest"
          docker tag auth-service:latest "$ECR_REGISTRY/auth-service:${{ github.sha }}"

      - name: 📤 Push Auth to ECR
        run: |
          echo "Pushing Auth to ECR..."
          docker push "$ECR_REGISTRY/auth-service:latest"
          docker push "$ECR_REGISTRY/auth-service:${{ github.sha }}"
          echo "Auth pushed successfully!"

      # =========================
      # Chat Service
      # =========================

      - name: 🏗️ Build Chat Service Image
        run: |
          echo "Building Chat service..."
          docker build \
            -f backend/services/chat/Dockerfile \
            -t chat-service \
            backend
          echo "Chat build complete!"

      - name: 🏷️ Tag Chat Image
        run: |
          docker tag chat-service:latest "$ECR_REGISTRY/chat-service:latest"
          docker tag chat-service:latest "$ECR_REGISTRY/chat-service:${{ github.sha }}"

      - name: 📤 Push Chat to ECR
        run: |
          echo "Pushing Chat to ECR..."
          docker push "$ECR_REGISTRY/chat-service:latest"
          docker push "$ECR_REGISTRY/chat-service:${{ github.sha }}"
          echo "Chat pushed successfully!"

      # =========================
      # Agent Service
      # =========================

      - name: 🏗️ Build Agent Service Image
        run: |
          echo "Building Agent service..."
          docker build \
            -f backend/services/agent/Dockerfile \
            -t agent-service \
            backend
          echo "Agent build complete!"

      - name: 🏷️ Tag Agent Image
        run: |
          docker tag agent-service:latest "$ECR_REGISTRY/agent-service:latest"
          docker tag agent-service:latest "$ECR_REGISTRY/agent-service:${{ github.sha }}"

      - name: 📤 Push Agent to ECR
        run: |
          echo "Pushing Agent to ECR..."
          docker push "$ECR_REGISTRY/agent-service:latest"
          docker push "$ECR_REGISTRY/agent-service:${{ github.sha }}"
          echo "Agent pushed successfully!"

      # =========================
      # Billing Service
      # =========================

      - name: 🏗️ Build Billing Service Image
        run: |
          echo "Building Billing service..."
          docker build \
            -f backend/services/billing/Dockerfile \
            -t billing-service \
            backend
          echo "Billing build complete!"

      - name: 🏷️ Tag Billing Image
        run: |
          docker tag billing-service:latest "$ECR_REGISTRY/billing-service:latest"
          docker tag billing-service:latest "$ECR_REGISTRY/billing-service:${{ github.sha }}"

      - name: 📤 Push Billing to ECR
        run: |
          echo "Pushing Billing to ECR..."
          docker push "$ECR_REGISTRY/billing-service:latest"
          docker push "$ECR_REGISTRY/billing-service:${{ github.sha }}"
          echo "Billing pushed successfully!"

      # =========================
      # ECS Service Deployments
      # =========================

      - name: 🚀 Deploy Gateway to ECS
        run: |
          echo "Deploying Gateway service to ECS..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.GATEWAY_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager
          echo "Gateway deployment initiated!"

      - name: 🚀 Deploy Auth to ECS
        run: |
          echo "Deploying Auth service to ECS..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.AUTH_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager
          echo "Auth deployment initiated!"

      - name: 🚀 Deploy Chat to ECS
        run: |
          echo "Deploying Chat service to ECS..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.CHAT_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager
          echo "Chat deployment initiated!"

      - name: 🚀 Deploy Agent to ECS
        run: |
          echo "Deploying Agent service to ECS..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.AGENT_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager
          echo "Agent deployment initiated!"

      - name: 🚀 Deploy Billing to ECS
        run: |
          echo "Deploying Billing service to ECS..."
          aws ecs update-service \
            --cluster "${{ secrets.ECS_CLUSTER }}" \
            --service "${{ secrets.BILLING_SERVICE }}" \
            --force-new-deployment \
            --no-cli-pager
          echo "Billing deployment initiated!"

      # =========================
      # Deployment Summary
      # =========================

      - name: 🎉 Deployment Complete
        run: |
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo "✅ CortexAI Deployment Successful!"
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
          echo ""
          echo "📦 Images pushed to ECR:"
          echo "  • Gateway: $ECR_REGISTRY/gateway:latest"
          echo "  • Auth: $ECR_REGISTRY/auth-service:latest"
          echo "  • Chat: $ECR_REGISTRY/chat-service:latest"
          echo "  • Agent: $ECR_REGISTRY/agent-service:latest"
          echo "  • Billing: $ECR_REGISTRY/billing-service:latest"
          echo ""
          echo "🚀 ECS Services updating..."
          echo "  • Cluster: ${{ secrets.ECS_CLUSTER }}"
          echo "  • Region: $AWS_REGION"
          echo ""
          echo "⏱️ Rolling deployment in progress..."
          echo "━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━"
